spring.application.name=kafka-spring-cloud-stream
server.port = 8080
spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=T2
spring.cloud.stream.bindings.pageEventSupplier-out-0.destination=T3
spring.cloud.stream.bindings.KstreamFunction-in-0.destination=T3
spring.cloud.stream.bindings.KstreamFunction-out-0.destination=T4
spring.cloud.function.definition=pageEventConsumer;pageEventSupplier;KstreamFunction
spring.cloud.stream.poller.fixed-delay=200
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000
spring.cloud.stream.kafka.streams.bindings.KstreamFunction-in-0.consumer.keySerde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.cloud.stream.kafka.streams.bindings.KstreamFunction-in-0.consumer.valueSerde=com.ebankservice.kafkaspringcloudstream.events.PageEventSerde
spring.cloud.stream.kafka.streams.bindings.KstreamFunction-out-0.producer.keySerde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.cloud.stream.kafka.streams.bindings.KstreamFunction-out-0.producer.valueSerde=org.apache.kafka.common.serialization.Serdes$LongSerde

